<!DOCTYPE html>
<html>
<head>
  <title>PNGTuber Control</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      margin-top: 30px;
      -webkit-app-region: drag;
      overflow: hidden;
    }

    button {
      margin: 10px;
      padding: 10px 20px;
      font-size: 16px;
      -webkit-app-region: no-drag; /* ✅ FIXED */
    }

    select {
      width: 220px;
      max-width: 220px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      -webkit-app-region: no-drag;
    }

    #settings {
      border-top: 1px solid #444;

      margin-top: 10px;
      padding-top: 10px;

      max-height: 0;
      overflow: hidden;

      opacity: 0;

      transition:
        max-height 0.3s ease,
        opacity 0.2s ease;
    }

    #settings.open {
      max-height: 300px;
      opacity: 1;
    }

    #sliderContainer {
      width: 220px;
      margin: 2px auto 0 auto;
    }

    #sensitivity {
      width: 100%;
    }

    #volumeContainer {
      width: 219px;
      height: 8px;

      margin: 2px auto 0 auto;

      background: #333;

      border-radius: 4px;

      overflow: hidden;
      transform: translateX(2px);
    }

    #volumeBar {
      width: 0%;
      height: 100%;

      background: lime;

      transition: width 0.05s linear;
    }

    #sensValue {
      display: none;
    }
  </style>
</head>
<body>

  <h2>PNGTuber Control</h2>

  <button onclick="start()">Start</button>
  <button onclick="stop()">Stop</button>
  <button onclick="setIdle()">Set Idle</button>
  <button onclick="setTalk()">Set Talk</button>
  <button onclick="exit()">Exit</button>
  <button id="settingsBtn"
          onclick="toggleSettings()">
    ⚙ Settings ▼
  </button>

  <div id="settings">
    <h3>Microphone</h3>
  
    <label>Input Device:</label>
    <br>

    <select id="micList" onchange="changeMic()">
    </select>
    
    <br><br>
    <label>Mic Sensitivity:</label>
    <br>

<div id="sliderContainer">

  <input
    type="range"
    min="10"
    max="100"
    value="45"
    id="sensitivity"
    oninput="updateSensitivity(this.value)"
  >

</div>

<span id="sensValue">45</span>

<div id="volumeContainer">
  <div id="volumeBar"></div>
</div>

<p id="volumeHint">
A delay & buffer prevent off-shoots caused by noise, <br>
i.e. it won't activate at *precisely* the slider point.
</p>

  </div>

  <script>
    const { ipcRenderer } = require('electron');

    function start() {
      ipcRenderer.send('start-avatar');
    }

    function stop() {
      ipcRenderer.send('stop-avatar');
    }

    function exit() {
      ipcRenderer.send('exit-app');
    }

    async function setIdle() {
      const path = await ipcRenderer.invoke('select-idle');
      if (path) ipcRenderer.send('update-idle', path);
    }

    async function setTalk() {
      const path = await ipcRenderer.invoke('select-talk');
      if (path) ipcRenderer.send('update-talk', path);
    }

    function toggleSettings() {

      const settings =
        document.getElementById('settings');

      const btn =
        document.getElementById('settingsBtn');

      settings.classList.toggle('open');

      const isOpen =
        settings.classList.contains('open');

      ipcRenderer.send(
        'toggle-settings-window',
        isOpen
      );

      if (isOpen) {
        btn.textContent = "Settings ▲";
      } else {
        btn.textContent = "Settings ▼";
      }
    }

    function updateSensitivity(value) {
      document.getElementById('sensValue').textContent = value;

      ipcRenderer.send('set-threshold', Number(value));
    }

    window.onload = async () => {
      const config = await ipcRenderer.invoke('get-config');

      if (config.threshold !== undefined) {

        document.getElementById('sensitivity').value =
          config.threshold;

        updateSensitivity(config.threshold);
      }

      const devices = await ipcRenderer.invoke('get-mics');

      const micList = document.getElementById('micList');

      const seenGroups = new Set();

      devices.forEach(mic => {

        if (
          mic.groupId &&
          seenGroups.has(mic.groupId)
        ) {
          return;
        }

        if (mic.groupId) {
          seenGroups.add(mic.groupId);
        }

        const option = document.createElement('option');

        const label = mic.label || "Unknown Microphone";

        option.value = mic.deviceId;
        option.textContent = label;
        option.title = label;

        micList.appendChild(option);
      });

      if (config.selectedMic) {
        micList.value = config.selectedMic;
        // if (micList.selectedOptions.length > 0) {
        //   document.getElementById('currentMic').textContent =
        //     micList.selectedOptions[0].textContent;
        // }
      }

      if (micList.value) {
        changeMic();
      }
    };

    function changeMic() {
      const micList = document.getElementById('micList');

      const micId = micList.value;

      ipcRenderer.send('change-mic', micId);
    }

    ipcRenderer.on('volume-update', (_, volume) => {

      document.getElementById('volumeBar').style.width =
        `${volume}%`;

    });
  </script>

</body>
</html>
